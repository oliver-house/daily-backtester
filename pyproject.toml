[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-backtester"
version = "4.0.0"
description = "Daily backtesting engine with data-snooping-aware significance testing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[tool.setuptools]
packages = ["backtest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Long f-string report lines in the CLI printers read better unsplit.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests import private helpers deliberately and shadow names for clarity.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
