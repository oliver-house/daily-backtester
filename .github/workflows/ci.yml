name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Smoke test the CLIs offline
        run: |
          python run.py SPY --strategy sma --cache-dir tests/fixtures/prices --offline --no-plot
          python sweep.py SPY QQQ --cache-dir tests/fixtures/prices --offline
          python report.py SPY QQQ JPM --cache-dir tests/fixtures/prices --offline
