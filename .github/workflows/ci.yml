name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Smoke test the CLIs offline
        run: |
          python run.py SPY --strategy sma --cache-dir tests/fixtures/prices --offline --no-plot
          python sweep.py SPY QQQ --cache-dir tests/fixtures/prices --offline
          python report.py SPY QQQ JPM --cache-dir tests/fixtures/prices --offline
