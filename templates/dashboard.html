<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Backtesting Engine</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --benchmark: #9ca3af; --panel: #f9fafb;
    --good: #047857; --bad: #b91c1c; --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --fg: #e6e6e6; --muted: #9ca3af; --line: #2a2f3a;
      --accent: #60a5fa; --benchmark: #6b7280; --panel: #161a22;
      --good: #34d399; --bad: #f87171; --input-bg: #0f1115;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem 1rem 1.25rem; background: var(--bg); color: var(--fg);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 1.15rem; margin: 0 0 .6rem; letter-spacing: -0.01em; }
  .controls {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
    gap: .5rem .6rem; margin-bottom: .35rem; padding: .6rem .7rem; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .field label {
    font-size: .65rem; text-transform: uppercase; letter-spacing: .03em;
    color: var(--muted); display: block; margin-bottom: .15rem;
  }
  select, input[type=number] {
    font: inherit; font-size: .85rem; padding: .25rem .4rem; border: 1px solid var(--line);
    border-radius: 5px; background: var(--input-bg); color: var(--fg); width: 100%;
  }
  .strategy-params { display: none; }
  .strategy-params.active { display: block; }
  .warning { color: var(--bad); font-size: .75rem; margin: .3rem 0 0; min-height: 1.1em; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .6rem .7rem; }
  .layout { display: grid; grid-template-columns: 3fr 2fr; gap: .6rem; margin-top: .5rem; align-items: start; }
  @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } }
  #stats { margin-top: 0; }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 1rem; font-size: .72rem; color: var(--muted); margin-top: .3rem; flex-wrap: wrap; }
  .swatch { display: inline-block; width: 1.3rem; height: 2px; vertical-align: middle; margin-right: .3rem; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: .25rem .4rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  thead th { font-size: .65rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .scroll { overflow-x: auto; }
  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .note { font-size: .75rem; color: var(--muted); }
  .verdict { border-left: 3px solid var(--accent); padding: .4rem .6rem; margin: .5rem 0 0; background: var(--panel); font-size: .8rem; }
  footer { margin-top: 1.25rem; padding-top: .6rem; border-top: 1px solid var(--line); font-size: .7rem; color: var(--muted); }
  code { font-size: .85em; background: var(--panel); padding: .1rem .3rem; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Daily Backtesting Engine</h1>

  <div class="controls">
    <div class="field"><label for="ticker">Ticker</label><select id="ticker"></select></div>
    <div class="field"><label for="strategy">Strategy</label><select id="strategy"></select></div>
    <div class="field"><label for="cost">Cost (bps)</label>
      <input type="number" id="cost" min="0" max="500" step="1"></div>
    <div class="field"><label for="rf">Risk-free rate (%)</label>
      <input type="number" id="rf" min="-99" max="500" step="0.1"></div>
    <div class="field strategy-params" data-strategy="sma">
      <label for="fast">Fast window</label><input type="number" id="fast" min="1" max="400" step="1">
    </div>
    <div class="field strategy-params" data-strategy="sma">
      <label for="slow">Slow window</label><input type="number" id="slow" min="2" max="500" step="1">
    </div>
    <div class="field strategy-params" data-strategy="vol">
      <label for="targetVol">Target vol (%)</label><input type="number" id="targetVol" min="0" max="100" step="1">
    </div>
    <div class="field strategy-params" data-strategy="vol">
      <label for="lookback">Lookback (days)</label><input type="number" id="lookback" min="1" max="250" step="1">
    </div>
  </div>
  <p class="warning" id="warning"></p>

  <div class="layout">
    <div class="panel">
      <svg id="chart" viewBox="0 0 800 220" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend">
        <span><span class="swatch" style="background:var(--accent)"></span><span id="legend-strategy">Strategy</span></span>
        <span><span class="swatch" style="background:var(--benchmark)"></span>Buy &amp; hold</span>
        <span class="note">Log scale, start = 1</span>
      </div>
    </div>

    <div class="panel">
      <table id="stats"></table>
      <div class="verdict" id="verdict"></div>
    </div>
  </div>

  <footer>
    Generated <span id="generated"></span> by <code>report.py</code>; recomputed live by
    the same formulas as <code>backtest/engine.py</code>. Data: Yahoo Finance, split- and
    dividend-adjusted. Source:
    <a href="https://github.com/oliver-house/daily-backtester">github.com/oliver-house/daily-backtester</a>.
  </footer>
</div>

<script>
const DATA = /*DATA*/null/*END*/;
const TRADING_DAYS = 252;

// ---------------------------------------------------------------------
// Engine: a direct port of backtest/engine.py, backtest/strategy.py, and
// backtest/inference.py. Every formula here has a corresponding line in
// the Python source, so the two stay in sync by inspection.
// ---------------------------------------------------------------------

function mean(a) { return a.reduce((s, v) => s + v, 0) / a.length; }

function sampleStd(a) {
  if (a.length < 2) return 0;
  const m = mean(a);
  const ss = a.reduce((s, v) => s + (v - m) ** 2, 0);
  return Math.sqrt(ss / (a.length - 1));
}

function rollingMean(a, window) {
  const out = new Array(a.length).fill(NaN);
  let sum = 0;
  for (let i = 0; i < a.length; i++) {
    sum += a[i];
    if (i >= window) sum -= a[i - window];
    if (i >= window - 1) out[i] = sum / window;
  }
  return out;
}

function rollingStd(a, window) {
  // Matches pandas rolling(window).std(): NaN unless the full window is
  // free of NaN, sample standard deviation (ddof=1).
  const out = new Array(a.length).fill(NaN);
  for (let i = window - 1; i < a.length; i++) {
    const win = a.slice(i - window + 1, i + 1);
    if (win.some(Number.isNaN)) continue;
    out[i] = sampleStd(win);
  }
  return out;
}

function pctChange(prices) {
  // pandas .pct_change(): NaN for the first element, undefined otherwise.
  const out = new Array(prices.length).fill(NaN);
  for (let i = 1; i < prices.length; i++) out[i] = (prices[i] - prices[i - 1]) / prices[i - 1];
  return out;
}

const Strategy = {
  hold: (prices) => prices.map(() => 1.0),

  sma: (prices, { fast, slow }) => {
    if (fast < 1 || fast >= slow) return prices.map(() => 0.0);
    const f = rollingMean(prices, fast), s = rollingMean(prices, slow);
    return prices.map((_, i) => (f[i] > s[i]) ? 1.0 : 0.0); // NaN > NaN is false, matches pandas
  },

  vol: (prices, { targetVol, lookback, maxLeverage = 1.0 }) => {
    if (targetVol < 0 || lookback < 1) return prices.map(() => 0.0);
    const returns = pctChange(prices);
    const realised = rollingStd(returns, lookback).map(v => v * Math.sqrt(TRADING_DAYS));
    return realised.map(v => {
      if (!(v > 0)) return 0.0; // NaN (warm-up) or exactly 0 (unusable): flat
      return Math.min(targetVol / v, maxLeverage);
    });
  },
};

function riskAdjustedRatio(meanExcess, dispersion) {
  if (dispersion > 0) return (meanExcess / dispersion) * Math.sqrt(TRADING_DAYS);
  if (meanExcess > 0) return Infinity;
  if (meanExcess < 0) return -Infinity;
  return 0.0;
}

function runBacktest(prices, positions, costBps, rfAnnual) {
  const n = prices.length;
  const assetReturns = new Array(n).fill(0);
  for (let i = 1; i < n; i++) assetReturns[i] = (prices[i] - prices[i - 1]) / prices[i - 1];

  const held = new Array(n).fill(0);
  for (let i = 1; i < n; i++) held[i] = positions[i - 1];

  const costs = new Array(n).fill(0);
  costs[0] = costBps / 10000 * Math.abs(positions[0]);
  for (let i = 1; i < n; i++) costs[i] = costBps / 10000 * Math.abs(positions[i] - positions[i - 1]);

  const rfDaily = Math.pow(1 + rfAnnual, 1 / TRADING_DAYS) - 1;
  const daily = new Array(n);
  for (let i = 0; i < n; i++) {
    daily[i] = held[i] * assetReturns[i] + (1 - held[i]) * rfDaily - costs[i];
  }

  // 1 + d_t = h_t(1+r_t) + (1-h_t)(1+rho) - c_t must stay > 0, or equity hits
  // zero/negative -- only costs can cause this. Mirrors the raise in
  // backtest/engine.py rather than silently producing NaN/garbage equity.
  const equity = new Array(n);
  let cum = 1;
  for (let i = 0; i < n; i++) {
    const growth = 1 + daily[i];
    if (growth <= 0) {
      // Carry the raw day index rather than formatting a message here:
      // this function only has prices/positions, not the ticker's date
      // strings, so the caller (which does) builds the final wording.
      const err = new Error("equity wipeout");
      err.dayIndex = i;
      err.dailyReturn = daily[i];
      throw err;
    }
    cum *= growth;
    equity[i] = cum;
  }

  let trades = 0;
  if (Math.abs(positions[0]) !== 0) trades++;
  for (let i = 1; i < n; i++) if (positions[i] !== positions[i - 1]) trades++;

  return { daily, equity, rfDaily, trades };
}

function computeStats(equity, daily, rfDaily, trades) {
  const n = daily.length;
  const totalReturn = equity[n - 1] - 1;
  const years = n / TRADING_DAYS;
  const cagr = years > 0 ? Math.pow(equity[n - 1], 1 / years) - 1 : 0;
  const vol = sampleStd(daily) * Math.sqrt(TRADING_DAYS);

  const excess = daily.map(d => d - rfDaily);
  const sharpe = riskAdjustedRatio(mean(excess), sampleStd(excess));

  const downside = excess.map(e => Math.min(e, 0) ** 2);
  const downsideDev = Math.sqrt(mean(downside));
  const sortino = riskAdjustedRatio(mean(excess), downsideDev);

  let sharpeSe, ciLow, ciHigh;
  if (!isFinite(sharpe)) {
    sharpeSe = Infinity; ciLow = ciHigh = sharpe;
  } else {
    sharpeSe = Math.sqrt((TRADING_DAYS + 0.5 * sharpe ** 2) / n);
    ciLow = sharpe - 1.96 * sharpeSe; ciHigh = sharpe + 1.96 * sharpeSe;
  }

  let peak = 1, maxDrawdown = 0;
  for (let i = 0; i < n; i++) {
    peak = Math.max(peak, equity[i]);
    maxDrawdown = Math.min(maxDrawdown, equity[i] / peak - 1);
  }

  return { total_return: totalReturn, cagr, annual_vol: vol, sharpe,
           sharpe_se: sharpeSe, sharpe_ci_low: ciLow, sharpe_ci_high: ciHigh,
           sortino, max_drawdown: maxDrawdown, trades, days: n };
}

function erfc(x) {
  // Abramowitz-Stegun 7.1.26, |error| < 1.5e-7.
  const z = Math.abs(x);
  const t = 1 / (1 + 0.5 * z);
  const tau = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 +
    t * (0.09678418 + t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 +
    t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
  return x >= 0 ? tau : 2 - tau;
}

function pairedTest(strategyDaily, benchmarkDaily) {
  const diff = strategyDaily.map((d, i) => d - benchmarkDaily[i]);
  const n = diff.length;
  if (n === 0) return { mean_diff: 0, se: 0, t_stat: 0, p_value: 1, days: 0, lags: 0 };

  const meanDiff = mean(diff);
  const lags = Math.max(0, Math.min(Math.floor(4 * (n / 100) ** (2 / 9)), n - 1));
  const dev = diff.map(v => v - meanDiff);
  let variance = dev.reduce((s, v) => s + v * v, 0) / n;
  for (let j = 1; j <= lags; j++) {
    let cov = 0;
    for (let i = j; i < n; i++) cov += dev[i] * dev[i - j];
    cov /= n;
    variance += 2 * (1 - j / (lags + 1)) * cov;
  }
  const se = variance > 0 ? Math.sqrt(variance / n) : 0;
  const tStat = se > 0 ? meanDiff / se : 0;
  const pValue = se > 0 ? erfc(Math.abs(tStat) / Math.SQRT2) : 1;
  return { mean_diff: meanDiff, se, t_stat: tStat, p_value: pValue, days: n, lags };
}

// ---------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------

const pct = v => (v * 100).toFixed(2) + "%";
const pct1 = v => (v * 100).toFixed(1) + "%";
const num = v => (v === null || !isFinite(v)) ? (v > 0 ? "&infin;" : v < 0 ? "-&infin;" : "&mdash;") : v.toFixed(2);
function el(id) { return document.getElementById(id); }

function fill(select, values, labels) {
  select.innerHTML = values.map((v, i) => `<option value="${v}">${labels ? labels[i] : v}</option>`).join("");
}

// Below this fraction of starting capital, an account is economically dead:
// a real account this far underwater would be liquidated or margin-called,
// not left to keep trading. So the floor is permanent, not per-day -- once
// crossed, the plotted line stays flat for the rest of the sample, even if
// the model's literal (uninterrupted) arithmetic would technically recover.
// This floors the drawn line only -- the statistics table still uses the
// engine's true, unmodified values, since that's what has been verified to
// match backtest/engine.py exactly.
const RUIN_FLOOR = 1e-4;

function stickyFloor(equity) {
  let ruined = false;
  return equity.map(v => {
    if (v < RUIN_FLOOR) ruined = true;
    return ruined ? RUIN_FLOOR : v;
  });
}

function drawChart(strategyEquity, benchmarkEquity) {
  const W = 800, H = 220, L = 46, R = 10, T = 10, B = 28;
  const strategyPlot = stickyFloor(strategyEquity);
  const benchmarkPlot = stickyFloor(benchmarkEquity);
  const all = strategyPlot.concat(benchmarkPlot).filter(v => v > 0);
  const lo = Math.log(Math.min(...all)), hi = Math.log(Math.max(...all));
  const pad = (hi - lo) * 0.06 || 0.1;
  const y0 = lo - pad, y1 = hi + pad;
  const n = strategyEquity.length;

  const px = i => L + (i / (n - 1)) * (W - L - R);
  const py = v => T + (1 - (Math.log(v) - y0) / (y1 - y0)) * (H - T - B);
  const path = s => s.map((v, i) => (i ? "L" : "M") + px(i).toFixed(1) + " " + py(v).toFixed(1)).join(" ");

  const decades = [0.1, 0.25, 0.5, 1, 2, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000];
  const ticks = decades.filter(d => Math.log(d) >= y0 && Math.log(d) <= y1);

  let svg = "";
  for (const t of ticks) {
    const y = py(t).toFixed(1);
    svg += `<line x1="${L}" y1="${y}" x2="${W - R}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    svg += `<text x="${L - 8}" y="${y}" dy="0.32em" text-anchor="end" font-size="11" fill="var(--muted)">${t}&times;</text>`;
  }
  const step = Math.max(1, Math.floor(n / 6));
  const dates = DATA.series[el("ticker").value].dates;
  for (let i = 0; i < n; i += step) {
    svg += `<text x="${px(i).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${dates[i].slice(0, 4)}</text>`;
  }
  svg += `<path d="${path(benchmarkPlot)}" fill="none" stroke="var(--benchmark)" stroke-width="1.5"/>`;
  svg += `<path d="${path(strategyPlot)}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  el("chart").innerHTML = svg;
}

function statsTable(label, stats, benchStats) {
  const rows = [
    ["Total return", pct1(stats.total_return), pct1(benchStats.total_return)],
    ["CAGR", pct(stats.cagr), pct(benchStats.cagr)],
    ["Volatility", pct(stats.annual_vol), pct(benchStats.annual_vol)],
    ["Sharpe", num(stats.sharpe), num(benchStats.sharpe)],
    ["Max DD", pct1(stats.max_drawdown), pct1(benchStats.max_drawdown)],
    ["Trades", stats.trades, benchStats.trades],
  ];
  el("stats").innerHTML =
    `<thead><tr><th></th><th>${label}</th><th>Buy &amp; hold</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("") + `</tbody>`;
}

function verdict(sig) {
  const diff = sig.mean_diff * TRADING_DAYS;
  const cls = diff >= 0 ? "good" : "bad";
  const text = sig.p_value < 0.05 ? "statistically significant at p &lt; 0.05"
                                   : "<strong>not</strong> statistically significant";
  el("verdict").innerHTML =
    `Against buy &amp; hold: <span class="${cls}">${diff >= 0 ? "+" : ""}${pct(diff)}/yr</span>, ` +
    `t = ${sig.t_stat.toFixed(2)}, p = ${sig.p_value.toFixed(3)} — ${text}. ` +
    `<span class="note">(Newey–West, ${sig.lags} lags, ${sig.days} days.)</span>`;
}

function currentParams(strategy) {
  if (strategy === "sma") return { fast: clampField("fast"), slow: clampField("slow") };
  if (strategy === "vol") return { targetVol: clampField("targetVol") / 100, lookback: clampField("lookback") };
  return {};
}

function updateParamVisibility(strategy) {
  document.querySelectorAll(".strategy-params").forEach(node => {
    node.classList.toggle("active", node.dataset.strategy === strategy);
  });
}

function clampField(id) {
  // The HTML min/max attributes only affect the spinner arrows -- typing a
  // value directly (e.g. pasting 10000) bypasses them entirely. Enforce the
  // range here instead, and correct the visible field so it never silently
  // differs from what's actually used.
  const field = el(id);
  const min = +field.min, max = +field.max;
  let v = +field.value;
  if (v < min) v = min;
  if (v > max) v = max;
  if (v !== +field.value) field.value = v;
  return v;
}

function render() {
  const ticker = el("ticker").value;
  const strategy = el("strategy").value;
  const costBps = clampField("cost");
  const rf = clampField("rf") / 100;
  const params = currentParams(strategy);

  el("warning").textContent =
    (strategy === "sma" && params.fast >= params.slow) ? "Fast window must be shorter than slow." : "";

  const prices = DATA.series[ticker].prices;
  const positions = Strategy[strategy](prices, params);
  const benchPositions = Strategy.hold(prices);

  let result, benchResult;
  try {
    result = runBacktest(prices, positions, costBps, rf);
    benchResult = runBacktest(prices, benchPositions, costBps, rf);
  } catch (err) {
    // No valid result exists for these inputs. Clear the chart/stats rather
    // than leaving a stale render on screen -- an old chart still visible
    // here would misleadingly look like a real result for the current
    // (rejected) parameters. State the exact day and reduce the cost to fix it.
    const date = DATA.series[ticker].dates[err.dayIndex];
    el("warning").textContent =
      `Costs wiped out all equity on ${date}: that day's net return was ` +
      `${err.dailyReturn.toFixed(4)} (<= -100%) at cost_bps=${costBps}. Reduce the cost.`;
    el("chart").innerHTML =
      `<text x="400" y="170" text-anchor="middle" font-size="14" fill="var(--muted)">` +
      `No chart: see the error above.</text>`;
    el("stats").innerHTML = "";
    el("verdict").innerHTML = "";
    return;
  }

  const stats = computeStats(result.equity, result.daily, result.rfDaily, result.trades);
  const benchStats = computeStats(benchResult.equity, benchResult.daily, benchResult.rfDaily, benchResult.trades);

  const strategyLabel = { hold: "Buy & hold", sma: `SMA ${params.fast}/${params.slow}`,
                          vol: `Vol target ${(params.targetVol * 100).toFixed(0)}%` }[strategy];
  el("legend-strategy").textContent = strategyLabel;
  drawChart(result.equity, benchResult.equity);
  statsTable(strategyLabel, stats, benchStats);
  verdict(pairedTest(result.daily, benchResult.daily));

  // A single ruinous parameter choice can crush equity to a technically-positive
  // but economically meaningless sliver without ever hitting the hard equity<=0
  // error above -- flag it, since the chart below floors the line at that point.
  if (!el("warning").textContent) {
    const minEquity = Math.min(...result.equity);
    if (minEquity < RUIN_FLOOR) {
      // The exact minimum (e.g. 0.0000492%) is not itself meaningful -- state
      // the fixed, known threshold instead, and the day it first crossed that
      // threshold (not the day of the eventual minimum, which can be later).
      const day = result.equity.findIndex(v => v < RUIN_FLOOR);
      el("warning").textContent =
        `Equity fell below ${RUIN_FLOOR * 100}% of starting capital on ` +
        `${DATA.series[ticker].dates[day]}. A real account this far underwater ` +
        `would be liquidated, so the chart treats it as permanently ruined from ` +
        `that date, even where the statistics below (which show the model's exact, ` +
        `uninterrupted arithmetic) may reflect a technical recovery afterward.`;
    }
  }
}

function init() {
  el("generated").textContent = DATA.generated;
  fill(el("ticker"), DATA.tickers);
  fill(el("strategy"), ["sma", "vol", "hold"], ["SMA crossover", "Vol target", "Buy & hold"]);
  const d = DATA.defaults;
  el("cost").value = d.cost_bps;
  el("rf").value = (d.rf * 100).toFixed(1);
  el("fast").value = d.fast;
  el("slow").value = d.slow;
  el("targetVol").value = (d.target_vol * 100).toFixed(0);
  el("lookback").value = d.lookback;

  updateParamVisibility(el("strategy").value);
  ["ticker", "cost", "rf", "fast", "slow", "targetVol", "lookback"].forEach(id =>
    el(id).addEventListener("input", render));
  el("strategy").addEventListener("input", () => { updateParamVisibility(el("strategy").value); render(); });

  render();
}

init();
</script>
</body>
</html>
